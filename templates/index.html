<!-- Quick Login Bar for CreatorSaaS -->
<div style="background: #1e293b; color: white; padding: 15px; text-align: center;">
    <h3 style="margin: 0 0 10px 0;">🚀 CreatorSaaS Portal Access</h3>
    <form action="/login" method="POST" style="display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;">
        <input type="text" name="username" placeholder="Username" required style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc;">
        <input type="password" name="password" placeholder="Password" required style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc;">
        <button type="submit" style="padding: 7px 15px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Login to Dashboard</button>
    </form>
</div>
