<!-- Login Section -->
<div class="login-container" style="max-width: 400px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Login to CreatorSaaS</h2>
    <form action="/login" method="POST">
        <div style="margin-bottom: 15px;">
            <label for="username">Username / Email:</label><br>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Login to Dashboard
        </button>
    </form>
</div>
