<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorSaaS - Login & Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; text-align: center; }
        .hero { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 28px; }
        .stats { display: flex; justify-content: space-around; margin: 30px 0; background: #0f172a; padding: 15px; border-radius: 8px; }
        .stat-box h3 { margin: 0; color: #22c55e; font-size: 22px; }
        .stat-box p { margin: 5px 0 0; color: #94a3b8; font-size: 14px; }
        .login-form { margin-top: 30px; text-align: left; background: #334155; padding: 25px; border-radius: 8px; }
        .login-form input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border-radius: 5px; border: 1px solid #475569; background: #1e293b; color: white; box-sizing: border-box; }
        .login-form button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .login-form button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>🚀 Join India's Fastest Growing Creator Platform</h1>
        <p>Trusted by professional video editors and content creators.</p>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-box">
                <h3>10,000+</h3>
                <p>Downloads</p>
            </div>
            <div class="stat-box">
                <h3>50,000+</h3>
                <p>Searches & Reach</p>
            </div>
            <div class="stat-box">
                <h3>⭐ 4.9/5</h3>
                <p>Rating</p>
            </div>
        </div>

        <!-- Login Form on Landing Page -->
        <div class="login-form">
            <h3 style="margin-top:0; color:#f8fafc; text-align:center;">Login to Your Creator Account</h3>
            <form action="/login" method="POST">
                <label for="username">Username / Email:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit">Login & Open Dashboard</button>
            </form>
        </div>
    </div>

</body>
</html>
