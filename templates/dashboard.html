<div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl mt-6">
    <h3 class="text-xl font-bold mb-4 text-yellow-400 flex items-center">
        <i class="fas fa-magic mr-2"></i> Advanced Auto Thumbnail & Tag Generator
    </h3>
    
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Video Title / Topic</label>
            <input type="text" id="videoTitleInput" placeholder="Enter video title for auto-optimization..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
        </div>

        <div class="flex space-x-4">
            <button onclick="generateThumbnailAndTags()" class="flex-1 bg-red-600 hover:bg-red-700 font-bold py-3 px-4 rounded-lg transition shadow flex items-center justify-center space-x-2">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>Generate High-CTR Thumbnail & Tags</span>
            </button>
        </div>

        <!-- Output Preview Section -->
        <div id="aiOutputBox" class="hidden mt-6 bg-gray-900 p-4 rounded-lg border border-gray-700">
            <h4 class="text-sm font-bold text-yellow-400 mb-2"><i class="fas fa-check-circle"></i> AI Generated Assets:</h4>
            <p id="conceptText" class="text-sm text-gray-300 mb-2"></p>
            <div id="tagsContainer" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<!-- JavaScript Logic for Generator -->
<script>
    async function generateThumbnailAndTags() {
        const title = document.getElementById('videoTitleInput').value || "Viral Retro Cinematic Masterpiece";
        const response = await fetch('/api/v1/generate-thumbnail-tags', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title })
        });
        const data = await response.json();
        if (data.success) {
            document.getElementById('aiOutputBox').classList.remove('hidden');
            document.getElementById('conceptText').innerText = data.concept;
            const tagsBox = document.getElementById('tagsContainer');
            tagsBox.innerHTML = '';
            data.tags.forEach(tag => {
                tagsBox.innerHTML += `<span class="bg-gray-800 text-yellow-300 text-xs px-2.5 py-1 rounded-md border border-gray-700">#${tag}</span>`;
            });
        }
    }
</script>
